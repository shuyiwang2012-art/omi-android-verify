name: omi-login-verify-v12

# v11：先让模拟器独占 CPU 完成开机，再在脚本内启动 Firebase 模拟器 + 后端，最后点登录。
# 之前的失败是模拟器 15 分钟仍 offline——CPU 被后端/模拟器进程占用是主要嫌疑。

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/omi-login-verify-v12.yml'

permissions:
  contents: write

jobs:
  login:
    name: Login against isolated backend on emulator
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      NDK_VERSION: "28.2.13676358"
      APP_ID: "com.friend.ios.dev"
      FIREBASE_PROJECT_ID: "demo-omi-local"
      GOOGLE_CLOUD_PROJECT: "demo-omi-local"
      GCLOUD_PROJECT: "demo-omi-local"
      FIREBASE_AUTH_EMULATOR_HOST: "127.0.0.1:9099"
      FIRESTORE_EMULATOR_HOST: "127.0.0.1:8085"
      ENCRYPTION_SECRET: "local-verify-secret-0123456789abcdef0123456789abcdef"
      REDIS_DB_HOST: "127.0.0.1"
      REDIS_DB_PORT: "6379"
      ADMIN_KEY: "local-admin-key"
      OPENAI_API_KEY: "sk-local-placeholder"
      ELEVENLABS_API_KEY: ""
      DEEPGRAM_EXL_OBZ: ""
      PINECONE_API_KEY: ""
      PINECONE_INDEX_NAME: ""
      SONIOX_API_KEY: "local-placeholder"
      MODULATE_API_KEY: "local-placeholder"

    steps:
      - name: Free disk space on runner
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /usr/local/lib/android/sdk/system-images 2>/dev/null || true
          sudo apt-get clean
          df -h /

      - name: Checkout Omi app, backend and .github scripts
        uses: actions/checkout@v4
        with:
          repository: BasedHardware/omi
          ref: b301dc3d1f183770aeb041bc22d1a75cb6bedf35
          sparse-checkout: |
            app
            backend
            .github
          sparse-checkout-cone-mode: true
          fetch-depth: 1

      - name: Record source fingerprint
        run: |
          mkdir -p evidence
          git log -1 --format='commit=%H%ndate=%cI%nsubject=%s' | tee evidence/evidence_fingerprint.txt

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install system packages and redis
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq redis-server ffmpeg libopus0 libportaudio2 || true
          redis-server --daemonize yes --port 6379
          sleep 2
          redis-cli ping

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version-file: backend/.python-version

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/pylock*.toml

      - name: Install backend dependencies
        working-directory: backend
        run: |
          uv venv .venv
          uv pip sync pylock.toml --python .venv/bin/python
          .venv/bin/python -c "import fastapi, firebase_admin; print('deps ok')"

      - name: Install firebase-tools
        run: npm install -g firebase-tools@15 >/dev/null && firebase --version

      - name: Set up Flutter 3.44.5
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.5
          cache: true

      - name: Install Android SDK packages and NDK
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;${NDK_VERSION}" "cmake;3.22.1"
          printf 'sdk.dir=%s\nflutter.sdk=%s\n' "$ANDROID_HOME" "$FLUTTER_ROOT" > app/android/local.properties

      - name: Prepare secret-free local inputs
        working-directory: app
        run: |
          mkdir -p android/app/src/dev android/app/src/prod
          cp lib/firebase_options_local.dart lib/firebase_options_dev.dart
          cp lib/firebase_options_local.dart lib/firebase_options_prod.dart
          cp setup/prebuilt/google-services-local.json android/app/src/dev/google-services.json
          cp setup/prebuilt/google-services-local.json android/app/src/prod/google-services.json
          cp setup/prebuilt/key.properties android/key.properties
          printf 'API_BASE_URL=\nUSE_WEB_AUTH=true\nUSE_AUTH_CUSTOM_TOKEN=true\nSTAGING_API_URL=\n' > .dev.env
          : > .env
          flutter pub get
          dart run build_runner build --delete-conflicting-outputs

      - name: Build release APK for x86_64 emulator
        working-directory: app
        env:
          CM_KEYSTORE_PATH: ${{ github.workspace }}/app/setup/prebuilt/debug.keystore
          CM_KEYSTORE_PASSWORD: android
          CM_KEY_ALIAS: androiddebugkey
          CM_KEY_PASSWORD: android
        run: |
          flutter build apk --release --flavor dev --target-platform android-x64 \
            --dart-define=OMI_APP_PROFILE=local_dev
          ls -lh build/app/outputs/flutter-apk/

      - name: Enable KVM and free build daemons
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules >/dev/null
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm
          pkill -f GradleDaemon || true
          pkill -f KotlinCompileDaemon || true
          free -m

      - name: Boot emulator, start services, login, capture
        id: emu
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          emulator-boot-timeout: 1200
          target: default
          arch: x86_64
          disable-animations: true
          emulator-options: -accel off -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -memory 2048
          script: |
            set +e
            mkdir -p evidence
            {
              echo "=== boot state ==="; adb devices; adb shell getprop sys.boot_completed
              echo "=== wm ==="; adb shell wm size
              echo "=== free ==="; free -m
            } | tee evidence/runtime_diag.txt

            # 模拟器已就绪后再启服务，避免抢占开机 CPU
            mkdir -p emulate
            cat > emulate/firebase.json <<'JSON'
            {
              "emulators": {
                "auth": { "port": 9099, "host": "127.0.0.1" },
                "firestore": { "port": 8085, "host": "127.0.0.1" },
                "ui": { "enabled": false }
              },
              "firestore": { "rules": "firestore.rules" }
            }
            JSON
            cat > emulate/firestore.rules <<'RULES'
            rules_version = '2';
            service cloud.firestore {
              match /databases/{database}/documents {
                match /{document=**} { allow read, write: if true; }
              }
            }
            RULES
            (cd emulate && nohup firebase emulators:start --only auth,firestore --project demo-omi-local --config firebase.json > ../emulators.log 2>&1 &)
            for i in $(seq 1 60); do
              if curl -s -o /dev/null http://127.0.0.1:9099/ && curl -s -o /dev/null http://127.0.0.1:8085/; then echo "emulators up ${i}0s"; break; fi
              sleep 10
            done
            (cd backend && nohup .venv/bin/python -m uvicorn main:app --host 127.0.0.1 --port 8000 > ../backend.log 2>&1 &)
            for i in $(seq 1 60); do
              code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/health || true)
              if [ "$code" = "200" ]; then echo "backend up ${i}0s"; break; fi
              sleep 10
            done
            curl -s http://127.0.0.1:8000/health | tee evidence/health.json
            curl -s -X POST -F uid=local-dev-user http://127.0.0.1:8000/v1/auth/local-dev/custom-token | tee evidence/identity_probe.json
            grep -q "custom_token" evidence/identity_probe.json || echo "identity_probe_failed"

            timeout 120 adb reverse tcp:8000 tcp:8000; echo "reverse8000=$?" | tee -a evidence/runtime_diag.txt
            timeout 120 adb reverse tcp:9099 tcp:9099; echo "reverse9099=$?" | tee -a evidence/runtime_diag.txt
            timeout 300 adb install -r app/build/app/outputs/flutter-apk/app-dev-release.apk; echo "install=$?" | tee -a evidence/runtime_diag.txt
            for p in POST_NOTIFICATIONS RECORD_AUDIO ACCESS_FINE_LOCATION ACCESS_COARSE_LOCATION BLUETOOTH_CONNECT BLUETOOTH_SCAN; do
              timeout 30 adb shell pm grant "$APP_ID" "android.permission.$p" >/dev/null 2>&1
            done
            timeout 60 adb shell monkey -p "$APP_ID" -c android.intent.category.LAUNCHER 1; echo "monkey=$?" | tee -a evidence/runtime_diag.txt
            sleep 30
            timeout 60 adb exec-out screencap -p > evidence/01_welcome.png; echo "shot1=$?" | tee -a evidence/runtime_diag.txt
            timeout 60 adb logcat -d -v time > evidence/logcat_before_tap.txt
            timeout 60 adb shell uiautomator dump /sdcard/ui.xml >/dev/null 2>&1
            timeout 30 adb shell cat /sdcard/ui.xml > evidence/ui.xml 2>/dev/null
            SIZE=$(timeout 30 adb shell wm size | tr -d '\r' | awk -F'[: ]+' '{print $NF}')
            W=${SIZE%x*}; H=${SIZE#*x}
            echo "wm_size=${SIZE}" | tee -a evidence/runtime_diag.txt
            tapped=0
            if grep -q "Sign in (local dev)" evidence/ui.xml 2>/dev/null; then
              B=$(grep -o 'text="Sign in (local dev)"[^>]*bounds="\[[0-9]*,[0-9]*\]\[[0-9]*,[0-9]*\]"' evidence/ui.xml | head -1)
              X1=$(echo "$B" | sed -n 's/.*\[\([0-9]*\),\([0-9]*\)\]\[\([0-9]*\),\([0-9]*\)\].*/\1/p')
              Y1=$(echo "$B" | sed -n 's/.*\[\([0-9]*\),\([0-9]*\)\]\[\([0-9]*\),\([0-9]*\)\].*/\2/p')
              X2=$(echo "$B" | sed -n 's/.*\[\([0-9]*\),\([0-9]*\)\]\[\([0-9]*\),\([0-9]*\)\].*/\3/p')
              Y2=$(echo "$B" | sed -n 's/.*\[\([0-9]*\),\([0-9]*\)\]\[\([0-9]*\),\([0-9]*\)\].*/\4/p')
              if [ -n "$X1" ] && [ -n "$Y1" ]; then
                timeout 30 adb shell input tap $(( (X1 + X2) / 2 )) $(( (Y1 + Y2) / 2 )); echo "tap=bounds" | tee -a evidence/runtime_diag.txt
                tapped=1
              fi
            fi
            if [ "$tapped" = "0" ] && [ -n "$W" ]; then
              for ratio in 831 800 860; do
                timeout 30 adb shell input tap $((W / 2)) $((H * ratio / 1000)); echo "tap=ratio$ratio" | tee -a evidence/runtime_diag.txt
                sleep 12
                grep -q "local-dev auth: minted" backend.log && break
              done
            fi
            sleep 15
            timeout 60 adb exec-out screencap -p > evidence/02_after_signin.png; echo "shot2=$?" | tee -a evidence/runtime_diag.txt
            timeout 60 adb shell dumpsys activity activities > evidence/activities.txt
            timeout 60 adb shell dumpsys window > evidence/window.txt
            timeout 60 adb logcat -d -v time > evidence/logcat.txt
            timeout 30 adb shell pidof "$APP_ID" > evidence/pid.txt
            sleep 10
            timeout 60 adb exec-out screencap -p > evidence/03_home.png; echo "shot3=$?" | tee -a evidence/runtime_diag.txt
            grep -E "local-dev auth|POST /v1/auth|GET /v1/users" backend.log > evidence/backend_auth_lines.txt
            exit 0

      - name: Failure diagnostics
        if: always()
        run: |
          mkdir -p evidence
          {
            echo "outcome=${{ steps.emu.outcome }}"
            echo "--- adb ---"; adb devices || true
            echo "--- free ---"; free -m || true
            echo "--- top rss ---"; ps -eo pid,rss,comm --sort=-rss | head -12 || true
            echo "--- backend log tail ---"; tail -60 backend.log 2>/dev/null || true
            echo "--- emulators log tail ---"; tail -40 emulators.log 2>/dev/null || true
          } > evidence/emulator_failure_diag.txt 2>&1
          tail -n 500 backend.log > evidence/backend_log_tail.txt 2>/dev/null || true
          tail -n 200 emulators.log > evidence/emulators_log_tail.txt 2>/dev/null || true
          curl -s "http://127.0.0.1:8085/v1/projects/demo-omi-local/databases/(default)/documents/users" > evidence/firestore_users.json 2>/dev/null || true

      - name: Publish evidence via Contents API
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python - <<'PY'
          import base64, json, os, urllib.request
          token = os.environ['GH_TOKEN']
          repo = os.environ['GITHUB_REPOSITORY']
          run_id = os.environ.get('GITHUB_RUN_ID', '')
          api = f"https://api.github.com/repos/{repo}/contents/evidence"
          for name in sorted(os.listdir('evidence')):
              p = os.path.join('evidence', name)
              if not os.path.isfile(p) or os.path.getsize(p) == 0:
                  continue
              raw = open(p, 'rb').read()
              url = f"{api}/{name}"
              sha = None
              try:
                  req = urllib.request.Request(url, headers={'Authorization': f'Bearer {token}'})
                  sha = json.load(urllib.request.urlopen(req)).get('sha')
              except Exception:
                  pass
              body = {'message': f'evidence {name} run {run_id}', 'content': base64.b64encode(raw).decode(), 'branch': 'main'}
              if sha:
                  body['sha'] = sha
              req = urllib.request.Request(url, data=json.dumps(body).encode(), method='PUT',
                                           headers={'Authorization': f'Bearer {token}',
                                                    'Accept': 'application/vnd.github+json',
                                                    'Content-Type': 'application/json'})
              try:
                  urllib.request.urlopen(req); print('ok', name, len(raw))
              except Exception as e:
                  print('fail', name, e)
          PY

      - name: Upload evidence artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: login-evidence
          path: evidence/
          if-no-files-found: warn
