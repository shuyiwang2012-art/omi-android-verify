name: omi-android-verify

# 用途：在 GitHub 托管的 Ubuntu 上编译 Omi 官方 App 并在 Android 模拟器里启动，产出截图与日志。
# 源码不落到本仓库：运行时按 pinned commit 直接检出 BasedHardware/omi 的 app/ 子树。
# 不接后端、不做品牌改造、不使用真实 Firebase 项目（用仓库自带的 demo-omi-local 占位配置）。

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Build APK and launch on emulator
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      NDK_VERSION: "28.2.13676358"
      APP_ID: "com.friend.ios.dev"
      OMI_SHA: "b301dc3d1f183770aeb041bc22d1a75cb6bedf35"

    steps:
      - name: Checkout Omi app subtree at pinned commit
        uses: actions/checkout@v4
        with:
          repository: BasedHardware/omi
          ref: b301dc3d1f183770aeb041bc22d1a75cb6bedf35
          sparse-checkout: app
          sparse-checkout-cone-mode: true
          fetch-depth: 1

      - name: Record source fingerprint
        run: |
          git log -1 --format='commit=%H%ndate=%cI%nsubject=%s'
          git hash-object app/pubspec.yaml
          du -sh app

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Flutter 3.44.5
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.5
          cache: true

      - name: Install Android SDK packages and NDK
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;${NDK_VERSION}" "cmake;3.22.1"
          printf 'sdk.dir=%s\nflutter.sdk=%s\n' "$ANDROID_HOME" "$FLUTTER_ROOT" > app/android/local.properties

      - name: Prepare secret-free local inputs
        working-directory: app
        run: |
          mkdir -p android/app/src/dev android/app/src/prod
          cp lib/firebase_options_local.dart lib/firebase_options_dev.dart
          cp lib/firebase_options_local.dart lib/firebase_options_prod.dart
          cp setup/prebuilt/google-services-local.json android/app/src/dev/google-services.json
          cp setup/prebuilt/google-services-local.json android/app/src/prod/google-services.json
          cp setup/prebuilt/key.properties android/key.properties
          printf 'API_BASE_URL=\nUSE_WEB_AUTH=true\nUSE_AUTH_CUSTOM_TOKEN=true\nSTAGING_API_URL=\n' > .dev.env
          : > .env
          flutter pub get
          dart run build_runner build --delete-conflicting-outputs

      - name: Build release APK for x86_64 emulator
        working-directory: app
        env:
          CM_KEYSTORE_PATH: ${{ github.workspace }}/app/setup/prebuilt/debug.keystore
          CM_KEYSTORE_PASSWORD: android
          CM_KEY_ALIAS: androiddebugkey
          CM_KEY_PASSWORD: android
        run: |
          flutter build apk --release --flavor dev --target-platform android-x64 \
            --dart-define=OMI_APP_PROFILE=local_dev
          ls -lh build/app/outputs/flutter-apk/

      - name: Enable Linux KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: Install, launch, capture screenshot and logs
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -memory 2048
          script: |
            set -x
            mkdir -p evidence
            adb install -r app/build/app/outputs/flutter-apk/app-dev-release.apk
            adb shell pm list packages | grep "$APP_ID" || true
            adb shell monkey -p "$APP_ID" -c android.intent.category.LAUNCHER 1 || true
            sleep 30
            adb exec-out screencap -p > evidence/01_after_launch.png
            sleep 15
            adb exec-out screencap -p > evidence/02_second_shot.png
            adb shell dumpsys activity activities > evidence/activities.txt || true
            adb shell dumpsys window > evidence/window.txt || true
            adb logcat -d -v time > evidence/logcat.txt || true
            adb shell pidof "$APP_ID" > evidence/pid.txt || true

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: omi-android-evidence
          path: evidence/
          if-no-files-found: error

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: omi-apk
          path: app/build/app/outputs/flutter-apk/app-dev-release.apk
          if-no-files-found: warn
